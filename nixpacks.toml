[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = [ 
  'npm install', 
  'npm install @rollup/rollup-linux-x64-gnu --save-optional' 
]

[phases.build]
# Runs medusa build for the backend API
cmds = [ 
  'npm run build' 
]

[start]
# We execute the script and grant execution permissions first
cmd = 'chmod +x start.sh && ./start.sh'