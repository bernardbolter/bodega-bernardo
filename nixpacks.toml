[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
# Standard dependencies installation
cmds = [
  'npm install',
  'npm install @rollup/rollup-linux-x64-gnu --save-optional'
]

[phases.build]
# ONLY run the Medusa backend build (medusa build)
cmds = [
  'npm run build'
]

[start]
# ONLY run the Medusa backend start (medusa start)
cmd = 'npm run start'