[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = [
  'npm install',
  'npm install @rollup/rollup-linux-x64-gnu --save-optional'
]

[phases.build]
cmds = [
  'npm run build',
  'echo "=== Build completed ==="',
  'ls -la .medusa/',
  'ls -la .medusa/server/ || echo "No server folder"',
  'ls -la .medusa/server/public/ || echo "No public folder"',
  'find .medusa -name "index.html" || echo "No index.html found"'
]

[start]
cmd = 'npm run start'