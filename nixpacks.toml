[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = [
  'npm install',
  'npm install @rollup/rollup-linux-x64-gnu --save-optional'
]

[phases.build]
cmds = [
  'npm run build',
  'echo "=== Copying admin to correct location ==="',
  'mkdir -p .medusa/server/public/admin',
  'cp -r .medusa/client/* .medusa/server/public/admin/',
  'echo "=== Verifying copy ==="',
  'ls -la .medusa/server/public/admin/',
  'test -f .medusa/server/public/admin/index.html && echo "✓ index.html found!" || echo "✗ index.html missing"'
]

[start]
cmd = 'npm run start'