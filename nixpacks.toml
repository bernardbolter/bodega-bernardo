[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = [
  'npm install',
  'npm install @rollup/rollup-linux-x64-gnu --save-optional'
]

[phases.build]
cmds = [
  'npm run build',
  'echo "=== Build completed ==="',
  'ls -la .medusa/ || echo ".medusa not found"'
]

[start]
cmd = 'npm run start'