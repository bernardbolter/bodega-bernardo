[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
dependsOn = ['setup']
cmds = ['npm ci --prefer-offline --no-audit']

[phases.build]
dependsOn = ['install']
cmds = ['npm run build']

[start]
cmd = 'npm run start'

# This ensures build artifacts are kept
[phases.build]
cacheDirectories = ['.medusa']