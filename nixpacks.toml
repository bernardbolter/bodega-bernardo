[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = [
  'npm install',
  'npm install @rollup/rollup-linux-x64-gnu --save-optional'
]

[phases.build]
cmds = [
  'npm run build',
  'echo "=== Copying admin to correct location ==="',
  'mkdir -p .medusa/server/public',
  'cp -r .medusa/client .medusa/server/public/admin',
  'echo "=== Verifying copy ==="',
  'ls -la .medusa/server/public/admin/',
  'find .medusa/server/public -name "index.html"'
]

[start]
cmd = 'npm run start'