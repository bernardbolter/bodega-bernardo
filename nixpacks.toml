[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = [ 
  'npm install', 
  'npm install @rollup/rollup-linux-x64-gnu --save-optional' 
]

[phases.build]
# Runs medusa build for the backend API
cmds = [ 
  'npm run build' 
]

[start]
# FINAL ATTEMPT: We combine the script logic into a robust shell command:
# 1. Set environment variables.
# 2. Execute the npm start command.
cmd = 'export ADMIN_PATH="/no/admin/here" && export MEDUSA_ADMIN_PATH="/no/admin/here" && npm run start'