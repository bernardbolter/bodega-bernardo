[phases.setup]
nixPkgs = ['nodejs_20']

[phases.install]
cmds = [ 
  'npm install', 
  'npm install @rollup/rollup-linux-x64-gnu --save-optional' 
]

[phases.build]
# Runs medusa build for the backend API
cmds = [ 
  'npm run build' 
]

[start]
# CRITICAL FIX: We are injecting environment variables directly into the start command 
# to override the default integrated Admin serving behavior.
cmd = [
 'ADMIN_PATH=/no/admin/here MEDUSA_ADMIN_PATH=/no/admin/here npm run start'
]